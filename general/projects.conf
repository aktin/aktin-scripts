# projects[] is a flat array with stride=$projects_entry_width. Each entry:
#   [i+0] project name (matches folder name under ROOT_DIR)
#   [i+1] SDK path (SDK8 or SDK11)
#   [i+2] git ref (branch/tag) — may be empty if [i+3] is set
#   [i+3] git commit SHA — may be empty if [i+2] is set

projects_entry_width=4
projects=(
#project_name sdk     reference commit_id
 "aktin"      "$SDK8" 	""  ""
 "dwh-api"    "$SDK8"  	""  ""
 "dwh-db"     "$SDK8" 	""  ""
 "dwh-prefs"  "$SDK8"  	""  ""
 "r-script"   "$SDK8" 	""  ""
 "broker"     "$SDK11" 	""  ""
 "dwh-import" "$SDK8"  	"" ""
 "dwh-query"  "$SDK11"  ""  ""
 "dwh-admin"  "$SDK8"  	"" ""
 "dwh-j2ee"   "$SDK8"  "v1.6rc1"  ""
# "dwh-j2ee"   "$SDK8"  "v1.5.1rc1"  ""
)
